# docker-compose.onprem.yml
#
# Self-hosted Koku (on-prem / PostgreSQL-only, no Trino)
#
# Prerequisites:
#   - External PostgreSQL, Redis, Kafka, and S3-compatible storage (e.g. MinIO)
#   - Build the image:  docker build -t koku:onprem .
#   - Copy .env.onprem to .env and fill in connection details
#
# Usage:
#   docker compose -f docker-compose.onprem.yml up

x-koku-common: &koku-common
  image: koku:onprem
  environment: &koku-env
    ONPREM: "True"
    DEVELOPMENT: "True"
    ENHANCED_ORG_ADMIN: "True"
    DJANGO_SETTINGS_MODULE: koku.settings
    DJANGO_READ_DOT_ENV_FILE: "False"
    PROMETHEUS_MULTIPROC_DIR: /tmp
    # Database
    DATABASE_SERVICE_NAME: POSTGRES_SQL
    DATABASE_ENGINE: postgresql
    POSTGRES_SQL_SERVICE_HOST: ${POSTGRES_HOST:?}
    POSTGRES_SQL_SERVICE_PORT: ${POSTGRES_PORT:-5432}
    DATABASE_NAME: ${DATABASE_NAME:-postgres}
    DATABASE_USER: ${DATABASE_USER:-postgres}
    DATABASE_PASSWORD: ${DATABASE_PASSWORD:?}
    # Redis
    REDIS_HOST: ${REDIS_HOST:?}
    REDIS_PORT: ${REDIS_PORT:-6379}
    # Kafka
    INSIGHTS_KAFKA_HOST: ${KAFKA_HOST:?}
    INSIGHTS_KAFKA_PORT: ${KAFKA_PORT:-9092}
    KAFKA_CONNECT: "True"
    # S3 / MinIO
    S3_ENDPOINT: ${S3_ENDPOINT:?}
    S3_BUCKET_NAME: ${S3_BUCKET_NAME:-koku-bucket}
    S3_BUCKET_NAME_OCP_INGRESS: ${S3_BUCKET_NAME_OCP_INGRESS:-ocp-ingress}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
    S3_SECRET: ${S3_SECRET:?}
    # Identity (dev bypass)
    DEVELOPMENT_IDENTITY: ${DEVELOPMENT_IDENTITY:-{"identity":{"account_number":"10001","org_id":"1234567","type":"User","user":{"username":"user_dev","email":"user_dev@foo.com","is_org_admin":"True","access":{}}},"entitlements":{"cost_management":{"is_entitled":"True"}}}}
    # Worker settings
    POD_CPU_LIMIT: ${POD_CPU_LIMIT:-1}
    GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    GUNICORN_THREADS: ${GUNICORN_THREADS:-False}
    AUTO_DATA_INGEST: ${AUTO_DATA_INGEST:-True}
    RETAIN_NUM_MONTHS: ${RETAIN_NUM_MONTHS:-4}
    TAG_ENABLED_LIMIT: ${TAG_ENABLED_LIMIT:-200}
    KOKU_LOG_LEVEL: ${KOKU_LOG_LEVEL:-INFO}
    DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
    CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-INFO}
  restart: unless-stopped

services:
  koku-init:
    <<: *koku-common
    container_name: koku_init
    working_dir: /opt/koku/koku
    command: ["python", "manage.py", "migrate_schemas"]
    restart: "no"

  koku-server:
    <<: *koku-common
    container_name: koku_server
    # Uses the default CMD from the Dockerfile (scripts/entrypoint.sh → gunicorn)
    ports:
      - "${KOKU_PORT:-8000}:8000"
    depends_on:
      koku-init:
        condition: service_completed_successfully

  masu-server:
    <<: *koku-common
    container_name: masu_server
    environment:
      <<: *koku-env
      MASU: "True"
    ports:
      - "${MASU_PORT:-5042}:8000"
    depends_on:
      koku-init:
        condition: service_completed_successfully

  koku-worker:
    <<: *koku-common
    container_name: koku_worker
    working_dir: /opt/koku/koku
    command:
      [
        "celery",
        "-A",
        "koku",
        "worker",
        "--without-gossip",
        "-l",
        "info",
        "-Q",
        "celery,download,hcs,ocp,priority,summary,cost_model,refresh,subs_extraction,subs_transmission",
      ]
    depends_on:
      koku-init:
        condition: service_completed_successfully

  koku-beat:
    <<: *koku-common
    container_name: koku_beat
    working_dir: /opt/koku/koku
    command: ["celery", "-A", "koku", "beat", "-l", "info"]
    environment:
      <<: *koku-env
      SCHEDULE_REPORT_CHECKS: "True"
    depends_on:
      koku-init:
        condition: service_completed_successfully

  koku-listener:
    <<: *koku-common
    container_name: koku_listener
    working_dir: /opt/koku/koku
    command: ["python", "manage.py", "listener"]
    depends_on:
      koku-init:
        condition: service_completed_successfully
